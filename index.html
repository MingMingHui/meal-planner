<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Health Meal Planning Agent</title>
<meta name="description" content="A personalized, AI-powered health meal planning agent — calorie calculator, meal planner, recipe generator, shopping lists and progress tracking, all in your browser." />
<meta name="theme-color" content="#2F5233" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><circle cx=%2212%22 cy=%2212%22 r=%2211%22 fill=%22%232F5233%22/><path d=%22M12 5c-3.5 3-3.5 8 0 11 3.5-3 3.5-8 0-11z%22 fill=%22%23E08A1E%22/></svg>" />
<link rel="stylesheet" href="./css/variables.css" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="52" height="52">
      <circle cx="20" cy="20" r="19" fill="var(--primary)"/>
      <path d="M20 9c-6 5-6 14 0 19 6-5 6-14 0-19z" fill="var(--accent)"/>
    </svg>
    <h1>Health Meal Planning Agent</h1>
    <p class="auth-tagline">Plan smarter. Eat better. Track your progress.</p>
    <div class="auth-actions" id="auth-actions">
      <button class="btn btn-ghost auth-btn" id="auth-google-btn">Continue with Gmail</button>
      <button class="btn btn-ghost auth-btn" id="auth-microsoft-btn">Continue with Outlook</button>
      <div class="auth-divider"><span>OR</span></div>
      <button class="btn btn-primary auth-btn" id="auth-guest-btn">Continue as Guest</button>
    </div>
    <p class="small auth-note" id="auth-note"></p>
  </div>
</div>

<div id="toast-region" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script type="module" src="./js/authGate.js"></script>
</body>
</html>
