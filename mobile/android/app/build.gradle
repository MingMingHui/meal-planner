apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// ---------------------------------------------------------------------------
// Versioning — mobile/version.json is the source of truth (bump it with
// `npm run version:bump`). CI may override versionCode with
// ANDROID_VERSION_CODE so every uploaded build is strictly increasing.
// ---------------------------------------------------------------------------
def appVersion = new JsonSlurper().parse(file('../../version.json'))
def envVersionCode = System.getenv('ANDROID_VERSION_CODE')
def resolvedVersionCode = envVersionCode ? envVersionCode.toInteger() : (appVersion.versionCode as Integer)

// ---------------------------------------------------------------------------
// Release signing (upload key for Play App Signing). Read ONLY from
// environment variables so no keystore or password is ever committed.
// Without them, release builds are produced unsigned and cannot be uploaded.
// ---------------------------------------------------------------------------
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseSigning = keystorePath && file(keystorePath).exists() &&
        System.getenv('ANDROID_KEYSTORE_PASSWORD') && System.getenv('ANDROID_KEY_ALIAS') && System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace = "com.ch2digital.mealplannerai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ch2digital.mealplannerai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName appVersion.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // Fail the release build on errors flagged by Android lint (e.g. a
        // targetSdk regression), but don't block on warnings.
        abortOnError true
        checkReleaseBuilds true
    }
}

if (!hasReleaseSigning) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
            logger.warn('WARNING: ANDROID_KEYSTORE_* variables not set — the release build will be UNSIGNED and cannot be uploaded to Google Play. See docs/mobile-deployment/README.md → Signing.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
